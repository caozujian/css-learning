<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美食推荐</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 id="page-title">🍜 我爱的美食</h1>
    <p class="update-time"><em>最后更新：2025年1月8日</em></p>

    <div class="food-card">
        <h2 class="food-name">兰州拉面</h2>
        <img src="https://placehold.co/400x200/e8c170/white?text=兰州拉面" alt="兰州拉面">
        <p class="food-desc">推荐理由：<strong>汤清肉香，面条筋道</strong>，一碗下去整个人都暖了。</p>
        <p class="food-rating">评分：<span>⭐⭐⭐⭐⭐</span></p>
    </div>

    <div class="food-card">
        <h2 class="food-name">红烧鲫鱼</h2>
        <img src="https://placehold.co/400x200/d7c170/white?text=红烧鲫鱼" alt="兰州拉面">
        <p class="food-desc">推荐理由：<strong>肉质鲜嫩，营养丰富</strong>，一口小时候的味道。</p>
        <p class="food-rating">评分：<span>⭐⭐⭐⭐⭐</span></p>
    </div>


    <div class="food-card">
        <h2 class="food-name">红烧肉</h2>
        <img src="https://placehold.co/400x200/c0503c/white?text=红烧肉" alt="红烧肉">
        <p class="food-desc">推荐理由：<strong>肥而不腻，入口即化</strong>，配米饭是绝配。</p>
        <p class="food-rating">评分：<span>⭐⭐⭐⭐⭐</span></p>
    </div>

    <p class="footer-note"><em>更多美食敬请期待...</em></p>
</body>
</html>
