<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据看板</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

    <div class="layout">
        <!-- 侧边栏 -->
        <aside class="sidebar">
            <div class="sidebar-logo">📊 Dashboard</div>
            <nav class="sidebar-nav">
                <a href="#" class="active">📈 概览</a>
                <a href="#">📋 订单</a>
                <a href="#">👥 用户</a>
                <a href="#">📦 产品</a>
                <a href="#">⚙️ 设置</a>
            </nav>
        </aside>

        <!-- 主内容 -->
        <main class="main">
            <header class="main-header">
                <h1>数据概览</h1>
                <button class="menu-btn">☰</button>
            </header>

            <!-- 统计卡片 -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">📦</div>
                    <div class="stat-info">
                        <span class="stat-value">1,234</span>
                        <span class="stat-label">总订单</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">💰</div>
                    <div class="stat-info">
                        <span class="stat-value">¥89,200</span>
                        <span class="stat-label">总收入</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">👥</div>
                    <div class="stat-info">
                        <span class="stat-value">5,678</span>
                        <span class="stat-label">用户数</span>
                    </div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon">📈</div>
                    <div class="stat-info">
                        <span class="stat-value">12.5%</span>
                        <span class="stat-label">增长率</span>
                    </div>
                </div>
            </div>

            <!-- 最近订单表格 -->
            <div class="section">
                <h2>最近订单</h2>
                <div class="table-wrapper">
                    <table class="order-table">
                        <thead>
                            <tr>
                                <th>订单号</th>
                                <th>客户</th>
                                <th>日期</th>
                                <th>金额</th>
                                <th>状态</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td data-label="订单号">#2025001</td>
                                <td data-label="客户">张三</td>
                                <td data-label="日期">2025-01-05</td>
                                <td data-label="金额">¥299.00</td>
                                <td data-label="状态"><span class="badge done">已完成</span></td>
                            </tr>
                            <tr>
                                <td data-label="订单号">#2025002</td>
                                <td data-label="客户">李四</td>
                                <td data-label="日期">2025-01-05</td>
                                <td data-label="金额">¥1,580.00</td>
                                <td data-label="状态"><span class="badge pending">处理中</span></td>
                            </tr>
                            <tr>
                                <td data-label="订单号">#2025003</td>
                                <td data-label="客户">王五</td>
                                <td data-label="日期">2025-01-04</td>
                                <td data-label="金额">¥450.00</td>
                                <td data-label="状态"><span class="badge done">已完成</span></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        // 移动端菜单切换
        document.querySelector('.menu-btn').addEventListener('click', function() {
            document.querySelector('.sidebar').classList.toggle('open');
        });
    </script>
</body>
</html>
