<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <div class="image-demo">
    <div class="img-box">
        <p>cover</p>
        <img src="https://placehold.co/400x300/667eea/white?text=4:3" 
             style="width: 200px; height: 200px; object-fit: cover;">
    </div>
    <div class="img-box">
        <p>contain</p>
        <img src="https://placehold.co/400x300/667eea/white?text=4:3" 
             style="width: 200px; height: 200px; object-fit: contain; background: #eee;">
    </div>
</div>

<picture>
    <!-- 大屏幕用大图 -->
    <source media="(min-width: 1024px)" srcset="hero-large.jpg">
    <!-- 平板用中图 -->
    <source media="(min-width: 768px)" srcset="hero-medium.jpg">
    <!-- 手机用小图（默认） -->
    <img src="hero-small.jpg" alt="主视觉图">
</picture>

<div class="table-wrapper">
    <table>
        <thead>
            <tr>
                <th>订单号</th>
                <th>客户</th>
                <th>日期</th>
                <th>金额</th>
                <th>状态</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>#2025001</td>
                <td>张三</td>
                <td>2025-01-05</td>
                <td>¥299.00</td>
                <td><span class="status status-done">已完成</span></td>
            </tr>
            <!-- 更多行... -->
        </tbody>
    </table>
</div>

<hr>
<tr>
    <td data-label="订单号">#2025001</td>
    <td data-label="客户">张四</td>
    <td data-label="日期">2025-01-05</td>
    <td data-label="金额">¥299.00</td>
    <td data-label="状态">已完成</td>
</tr>

</body>
</html>
