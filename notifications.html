<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>消息通知</title>
    <link rel="stylesheet" href="notifications.css">
</head>
<body>
    <div class="notifications">
        <h2>📬 消息通知</h2>

        <div class="notification notification-system">
            <div class="notif-header">
                <span class="notif-icon">🔔</span>
                <span class="notif-title">系统通知</span>
                <span class="notif-time">10分钟前</span>
            </div>
            <p class="notif-body">你的账号已通过实名认证</p>
        </div>

        <div class="notification notification-comment">
            <div class="notif-header">
                <span class="notif-icon">💬</span>
                <span class="notif-title">新评论</span>
                <span class="notif-time">1小时前</span>
            </div>
            <p class="notif-body">张三回复了你的文章</p>
        </div>

        <div class="notification notification-warning">
            <div class="notif-header">
                <span class="notif-icon">⚠️</span>
                <span class="notif-title">提醒</span>
                <span class="notif-time">昨天</span>
            </div>
            <p class="notif-body">你的会员即将到期，请及时续费</p>
        </div>
    </div>
</body>
</html>
