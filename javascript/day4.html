<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript 第 4 课</title>
    <style>
        body {
            max-width: 760px;
            margin: 0 auto;
            padding: 24px;
            font-family: "Microsoft YaHei", sans-serif;
            line-height: 1.7;
            color: #333;
        }

        .todo-app {
            padding: 20px;
            background: #f3f5ff;
            border-radius: 8px;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #bbb;
            border-radius: 6px;
        }

        button {
            padding: 10px 16px;
            color: white;
            background: #667eea;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
        }

        ul {
            padding: 0;
            list-style: none;
        }

        li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 10px;
            padding: 10px 12px;
            background: white;
            border-radius: 6px;
        }

        li span {
            flex: 1;
        }

        li.done span {
            color: #888;
            text-decoration: line-through;
        }

        .delete-button {
            padding: 6px 10px;
            background: #d9534f;
        }

        #hint {
            min-height: 1.7em;
            color: #b04a3a;
        }

        pre {
            padding: 16px;
            overflow-x: auto;
            color: #f8f8f2;
            background: #282a36;
            border-radius: 8px;
        }

        code, pre {
            font-family: Consolas, monospace;
        }
    </style>
</head>
<body>
    <h1>JavaScript 第 4 课：待办事项列表</h1>

    <p>本项目的核心思路是：数据改变后，重新调用 <code>render</code> 函数更新页面。</p>
    <pre><code>const todos = [];

function render() {
    // 根据 todos 数组生成页面内容
}</code></pre>

    <div class="todo-app">
        <h2>我的待办</h2>
        <div class="input-row">
            <input id="todo-input" type="text" placeholder="例如：学习 JavaScript">
            <button id="add-button">添加</button>
        </div>
        <p id="hint"></p>
        <ul id="todo-list"></ul>
    </div>

    <script>
        const todos = [];
        const input = document.querySelector("#todo-input");
        const addButton = document.querySelector("#add-button");
        const todoList = document.querySelector("#todo-list");
        const hint = document.querySelector("#hint");

        function render() {
            todoList.replaceChildren();

            for (const [index, todo] of todos.entries()) {
                const item = document.createElement("li");
                const text = document.createElement("span");
                const completeButton = document.createElement("button");
                const deleteButton = document.createElement("button");

                item.className = todo.done ? "done" : "";
                text.textContent = todo.text;
                completeButton.textContent = todo.done ? "取消完成" : "完成";
                deleteButton.textContent = "删除";
                deleteButton.className = "delete-button";

                completeButton.addEventListener("click", function () {
                    todos[index].done = !todos[index].done;
                    render();
                });

                deleteButton.addEventListener("click", function () {
                    todos.splice(index, 1);
                    render();
                });

                item.append(text, completeButton, deleteButton);
                todoList.append(item);
            }
        }

        function addTodo() {
            const text = input.value.trim();

            if (text === "") {
                hint.textContent = "请先输入待办事项。";
                return;
            }

            todos.push({ text: text, done: false });
            input.value = "";
            hint.textContent = "";
            render();
        }

        addButton.addEventListener("click", addTodo);

        input.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                addTodo();
            }
        });
    </script>
</body>
</html>
