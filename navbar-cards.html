<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导航栏 + 卡片</title>
    <link rel="stylesheet" href="navbar-cards.css">
</head>
<body>

    <!-- 导航栏 -->
    <nav class="navbar">
        <div class="logo">🚀 MySite</div>
        <ul class="nav-links">
            <li><a href="#">首页</a></li>
            <li><a href="#">关于</a></li>
            <li><a href="#">服务</a></li>
            <li><a href="#">联系</a></li>
        </ul>
    </nav>

    <!-- 主内容 -->
    <main class="main-content">
        <h1>我们的服务</h1>
        <p>选择最适合你的方案</p>

        <div class="card-container">
            <!-- 卡片 1 -->
            <div class="card">
                <h3>🚀 入门版</h3>
                <p class="price">免费</p>
                <ul>
                    <li>基础功能</li>
                    <li>1GB 存储</li>
                    <li>社区支持</li>
                </ul>
                <button class="card-btn">开始使用</button>
            </div>

            <!-- 卡片 2 -->
            <div class="card card-featured">
                <h3>💎 专业版</h3>
                <p class="price">¥99/月</p>
                <ul>
                    <li>全部功能</li>
                    <li>50GB 存储</li>
                    <li>优先支持</li>
                </ul>
                <button class="card-btn">免费试用</button>
            </div>

            <!-- 卡片 3 -->
            <div class="card">
                <h3>🏢 企业版</h3>
                <p class="price">¥299/月</p>
                <ul>
                    <li>无限功能</li>
                    <li>无限存储</li>
                    <li>专属客服</li>
                </ul>
                <button class="card-btn">联系我们</button>
            </div>
        </div>
    </main>

</body>
</html>
